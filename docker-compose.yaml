name: bkk-traffic

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: Asia/Bangkok
    AIRFLOW__WEBSERVER__DEFAULT_UI_TIMEZONE: Asia/Bangkok
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 60
    TZ: Asia/Bangkok
    BKK_DATA_DIR: /opt/airflow/data
    BKK_CRAWL_DELAY: ${BKK_CRAWL_DELAY:-10}
  volumes:
    - ./dags:/opt/airflow/dags
    - ./plugins:/opt/airflow/plugins
    - ./scripts:/opt/airflow/scripts
    - ./logs:/opt/airflow/logs
    - ./data:/opt/airflow/data
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
    restart: always

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --role Admin --username "${AIRFLOW_ADMIN_USER:-admin}" \
          --password "${AIRFLOW_ADMIN_PASSWORD:-admin}" --firstname a --lastname b --email admin@example.com || true &&
        airflow pools set longdo_api 3 "traffic.longdo.com scrapers (rate limit อยู่ใน client, 10s/request)" &&
        setvar() { airflow variables get "$$1" >/dev/null 2>&1 || airflow variables set "$$1" "$$2"; } &&
        setvar bkk_backfill_start_date 2025-01-01 &&
        setvar bkk_backfill_pages_per_run 80 &&
        setvar bkk_realtime_max_pages 30 &&
        setvar bkk_recover_per_run 150 &&
        mkdir -p /opt/airflow/data/raw /opt/airflow/data/warehouse /opt/airflow/data/processed \
                 /opt/airflow/data/quality /opt/airflow/data/checkpoints
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      retries: 5
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

volumes:
  pg-data:
